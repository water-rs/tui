[package]
name = "waterui-tui"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Experimental terminal (TUI) backend for WaterUI"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
waterui-core = "0.3.2"
waterui-backend-core = { version = "0.1.2", default-features = false }
waterui-layout = "0.3.2"
waterui-text = "0.4.1"
waterui-controls = "0.3.2"
waterui-graphics = { version = "0.4.1", default-features = false, features = ["gpu"] }
waterui-icon = "0.3.2"
waterui-internal = { version = "0.4.1", default-features = false }
waterui-form = "0.3.2"
waterui-navigation = "0.3.2"
waterui-shape = "0.1.2"
nami = "0.11.2"
executor-core = { version = "0.7.1", features = ["std"] }
native-executor = "0.8.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions"] }
crossterm = "0.29"
unicode-width = "0.2"
pollster = "1.0"
tracing = "0.1"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64-simd = "0.8"
flate2 = "1.1"
rustix = { version = "1.1.4", features = ["process", "termios"] }

[dev-dependencies]
aither-acp = "0.4"
aither-mcp = "0.4"
async-channel = "2"
async-process = "2.5.0"
event-listener = "5.4.2"
futures-lite = "2.6.1"
shell-escape = "0.1"
strip-ansi-escapes = "0.2.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
waterui-text = { version = "0.4.1", features = ["markdown"] }

# This repository develops against the WaterUI checkout next door; the patch
# table is what keeps the version requirements above resolving to it. A
# consumer that pins `waterui-tui` by git supplies its own `[patch]` — the
# `water` CLI writes one into the generated crate.
[patch.crates-io]
aither-acp = { path = "/Users/lexoliu/Coding/aither/acp" }
aither-mcp = { path = "/Users/lexoliu/Coding/aither/mcp" }
waterui-core = { path = "/Users/lexoliu/Coding/waterui/core" }
waterui-backend-core = { path = "/Users/lexoliu/Coding/waterui/backends/core" }
waterui-layout = { path = "/Users/lexoliu/Coding/waterui/components/foundation/layout" }
waterui-text = { path = "/Users/lexoliu/Coding/waterui/components/foundation/text" }
waterui-controls = { path = "/Users/lexoliu/Coding/waterui/components/foundation/controls" }
waterui-graphics = { path = "/Users/lexoliu/Coding/waterui/components/visual/graphics" }
waterui-icon = { path = "/Users/lexoliu/Coding/waterui/components/foundation/icon" }
waterui-internal = { path = "/Users/lexoliu/Coding/waterui/src" }
waterui-form = { path = "/Users/lexoliu/Coding/waterui/components/foundation/form" }
waterui-navigation = { path = "/Users/lexoliu/Coding/waterui/components/foundation/navigation" }
waterui-shape = { path = "/Users/lexoliu/Coding/waterui/components/foundation/shape" }
