name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: water-rs/tui
    steps:
      # The `[patch.crates-io]` table names `../../waterui` and `../../aither`
      # relative to this repository, so the checkout sits under the same
      # `org/repo` layout those paths assume.
      - uses: actions/checkout@v4
        with:
          path: water-rs/tui
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. `RUSTUP_TOOLCHAIN` is the one
          # override that beats the file.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      # Resolution has to traverse `[patch.crates-io]`, which names sibling
      # checkouts `../../waterui` and `../../aither` relative to this
      # repository — the same `org/repo` layout the paths assume on a
      # developer machine, no machine-specific absolute paths. Each pin is
      # the commit whose in-tree crate versions satisfy this crate's
      # requirements: cargo rejects a patch whose version does not match, so
      # a pin moves whenever the declared requirements move.
      # `submodules` is required — the waterui workspace resolves `utils/nami`
      # and `kit/*` path dependencies.
      - uses: actions/checkout@v4
        with:
          repository: water-rs/waterui
          ref: 3bd754070df1482df39aab6ed59ccc6e0bb5a44d
          path: waterui
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: lexoliu/aither
          ref: 31cf735a3f555b061be088c056028cd4a8ec3a72
          path: aither
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      # The shipped artifact is what MSRV bounds: dev-dependencies may
      # legitimately require newer, so check the package targets only. The
      # lockfile is gitignored, so there is no `--locked` to pass.
      - run: cargo check
